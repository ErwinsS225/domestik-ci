<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F77F00">
  <title>Hors ligne · Domestik CI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #FBF7F1; color: #182232; padding: 20px; }
    .box { max-width: 380px; }
    .ico { font-size: 52px; }
    h1 { font-size: 22px; margin: 14px 0 8px; }
    p { color: #64748b; font-size: 15px; line-height: 1.6; }
    button { margin-top: 20px; padding: 13px 26px; border: 0; border-radius: 999px; background: #F77F00; color: #fff;
             font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px rgba(247,127,0,.35); }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Domestik CI a besoin d'une connexion pour afficher les dernières annonces.
       Vérifiez votre connexion (Wi-Fi ou données) puis réessayez.</p>
    <button onclick="location.reload()">🔄 Réessayer</button>
  </div>
</body>
</html>
